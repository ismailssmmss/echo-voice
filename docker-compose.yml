services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echo_voice}
      POSTGRES_USER: ${POSTGRES_USER:-echo_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-echo_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-echo_voice}
      REDIS_URL: redis://redis:6379/0
      WORKER_URL: http://ai-worker:8001
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-local-only-worker-token-change-before-production-2026}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-1800}
    ports:
      # Local-only by default. Set ECHO_BIND_HOST=0.0.0.0 in .env for a trusted LAN test device.
      - "${ECHO_BIND_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started
    volumes:
      - ./backend:/app

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-local-only-worker-token-change-before-production-2026}
      HF_HOME: /models/huggingface
      XDG_CACHE_HOME: /models/cache
      MODEL_CACHE_DIR: /models/huggingface
      MAX_REFERENCE_AUDIO_BYTES: "26214400"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./ai-worker:/app
      - model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  model_cache:
