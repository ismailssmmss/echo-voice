name: AI worker tests

on:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/ai-worker-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/ai-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-worker/requirements-test.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install fast test dependencies
        run: python -m pip install -r ai-worker/requirements-test.txt
      - name: Compile worker sources
        run: python -m compileall -q ai-worker/app
      - name: Test inference API validation and orchestration
        working-directory: ai-worker
        env:
          WORKER_API_TOKEN: worker-test-token-not-for-production-0123456789
        run: pytest -q
