name: AI worker image build

on:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/ai-worker-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/ai-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build inference worker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./ai-worker
          file: ./ai-worker/Dockerfile
          push: false
          tags: echo-voice-ai-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
