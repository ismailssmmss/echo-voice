name: Tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build Android release bundle
        working-directory: android
        run: gradle bundleRelease --no-daemon
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/bundle/release/*.aab \
            --title "Echo Voice ${GITHUB_REF_NAME}" \
            --notes "Automated build artifact. This release is not production-approved until model inference, privacy, authorization, and device tests are complete."
