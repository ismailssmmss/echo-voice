name: Android APK and AAB preview release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK and release AAB
        working-directory: android
        run: gradle assembleDebug bundleRelease --no-daemon

      - name: Verify Android outputs
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK and AAB workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-voice-android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android preview release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="preview-${RUN_NUMBER}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cat > release-notes.md <<'EOF'
          ## Echo Voice — Android engineering preview

          - `app-debug.apk`: debug-signed APK for direct installation and testing.
          - `app-release.aab`: unsigned release bundle output. It must be signed with a private release key before Google Play upload.

          The app requires a separately deployed backend and AI worker; model weights and a hosted inference API are not bundled in the Android app. Configure the API endpoint at build time with `-PapiBaseUrl=https://your-api.example/api/v1`.

          The AI worker integration uses SILMA TTS v1 for Arabic, English, and mixed Arabic-English speech. First inference may download model dependencies and take several minutes.

          This is an engineering preview, not a production or Google Play release. Production signing, device verification, deployment hardening, and Play Store review remain outstanding.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Echo Voice Android Preview ${RUN_NUMBER}" --notes-file release-notes.md
          fi
