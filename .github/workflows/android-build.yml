name: Android APK build and preview release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-voice-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android integration preview
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TAG="preview-${RUN_NUMBER}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cat > release-notes.md <<'EOF'
          ## Echo Voice — Android integration preview

          This debug-signed APK includes the connected Android voice studio: registration/login, reference audio selection, Arabic/English text synthesis request, consent confirmation, WAV playback, and export.

          **A backend deployment is required.** The app does not include model weights or a hosted API. Configure the app API URL at build time with `-PapiBaseUrl=https://your-api.example/api/v1`, deploy the backend and private AI worker, and configure matching service secrets before making inference requests.

          The AI worker integrates SILMA TTS v1 for Arabic, English, and mixed Arabic-English speech. The first inference downloads model dependencies and may take several minutes.

          This is a debug-signed engineering preview, not a Google Play production release. Production signing, device verification, deployment hardening, storage/history, account recovery, billing, and Play Store review remain outstanding.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "::warning::Release upload was denied by repository token permissions; the APK remains available as the workflow artifact."
            fi
          elif ! gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Echo Voice Integration Preview ${RUN_NUMBER}" --notes-file release-notes.md; then
            echo "::warning::GitHub denied creation of a new Release for this workflow token. The APK remains available as the workflow artifact."
          fi
